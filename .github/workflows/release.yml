name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Build artifacts
        run: npm run build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/php-simple-check-extension-v${GITHUB_REF_NAME#v}.zip" \
            "dist/php-simple-check.user.js" \
            --title "PHP Simple Check $GITHUB_REF_NAME" \
            --generate-notes
